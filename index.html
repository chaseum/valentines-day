<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>:3</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="pet-fall-layer" class="hidden" aria-hidden="true"></div>
    <main id="app">
      <section class="nes-container with-title" id="card">
        <p class="title">:3</p>
        <div id="pet-splash" class="pet-splash" aria-hidden="true">
          <img class="pet-splash-item pet-splash-cat" src="assets/my-cat.png" alt="" />
          <img class="pet-splash-item pet-splash-dog" src="assets/blake-dog.png" alt="" />
        </div>

        <div id="progress" class="progress">
          <div id="progress-label" class="progress-label">Step 1 of 5</div>
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>

        <div id="content">
          <h1 id="card-title" class="card-title">How well do you remember us?</h1>
          <p id="card-subtitle" class="card-subtitle">
            Three tiny questions... then one big one
          </p>
          <img id="step-image" class="step-image hidden" alt="" />
          <p id="question-text" class="question-text"></p>
          <div id="answers" class="answers"></div>
          <button id="start-btn" class="nes-btn is-primary" aria-label="Start quiz">
            Start
          </button>
          <div id="feedback" class="feedback" aria-live="polite"></div>
        </div>

        <div id="success" class="success hidden" aria-live="polite">
          <p id="success-text">Yay!!! Happy Valentine's Day My Fav Bear Ever <3 </p>
          <div class="pixel-heart" aria-hidden="true"></div>
          <button id="restart-btn" class="nes-btn is-primary hidden" aria-label="Restart quiz">
            Restart Quiz
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
